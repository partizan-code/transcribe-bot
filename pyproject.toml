[project]
name = "transcribe-bot"
version = "0.1.0"
description = "Asynchronous Telegram bot for audio and video transcription"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "assemblyai>=1.8.2",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
